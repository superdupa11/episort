[project]
name = "episort"
version = "0.2.0"
description = "Identify TV episodes in ripped files by their dialogue, and name them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rapidfuzz>=3.6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Local Whisper with PyTorch (--local-whisper). The default remote speaches
# server needs nothing extra.
whisper = ["openai-whisper>=20231117"]
# Whisper on the Apple Silicon GPU (--mlx-whisper)
mlx = ["mlx-whisper>=0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# PGS (Blu-ray bitmap) subtitle OCR; also needs the tesseract binary
ocr = ["pillow>=10.0.0"]
dev = ["pytest>=7.4.0", "pillow>=10.0.0"]

[project.scripts]
episort = "episort.identifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["episort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
